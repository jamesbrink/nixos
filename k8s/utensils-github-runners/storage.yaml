# A second local-path provisioner rooted on /storage-fast (ZFS, ~780G free).
#
# k3s ships one already, but it writes to /var/lib/rancher/k3s/storage on the
# root filesystem, which is 83% full and also carries the mold server's data.
# Re-pointing the built-in provisioner would move Rancher's monitoring PVCs
# too, so this runs a second, isolated instance instead.
#
# Runner work directories are large and short-lived: this keeps them off the
# root filesystem, where filling the disk would trigger kubelet eviction and
# take the mold server down with it.
---
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: storage-fast-path
provisioner: rancher.io/local-path-storage-fast
# Runner volumes are scratch: discard them with the pod.
reclaimPolicy: Delete
# The provisioner picks a node only once a pod is scheduled.
volumeBindingMode: WaitForFirstConsumer
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: local-path-config-storage-fast
  namespace: kube-system
data:
  config.json: |-
    {
      "nodePathMap": [
        {
          "node": "DEFAULT_PATH_FOR_NON_LISTED_NODES",
          "paths": ["/storage-fast/k8s-local-path"]
        }
      ]
    }
  setup: |-
    #!/bin/sh
    set -eu
    mkdir -m 0777 -p "$VOL_DIR"
  teardown: |-
    #!/bin/sh
    set -eu
    rm -rf "$VOL_DIR"
  helperPod.yaml: |-
    apiVersion: v1
    kind: Pod
    metadata:
      name: helper-pod
    spec:
      containers:
        - name: helper-pod
          image: busybox
          imagePullPolicy: IfNotPresent
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: local-path-provisioner-storage-fast
  namespace: kube-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: local-path-provisioner-storage-fast
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  # Reuse the cluster role k3s already created for its own provisioner.
  name: local-path-provisioner-role
subjects:
  - kind: ServiceAccount
    name: local-path-provisioner-storage-fast
    namespace: kube-system
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: local-path-provisioner-storage-fast
  namespace: kube-system
spec:
  replicas: 1
  selector:
    matchLabels:
      app: local-path-provisioner-storage-fast
  template:
    metadata:
      labels:
        app: local-path-provisioner-storage-fast
    spec:
      serviceAccountName: local-path-provisioner-storage-fast
      # hal9000 is the only Ready node and the only one with /storage-fast.
      nodeSelector:
        gha-tier: selfhost-l
      containers:
        - name: local-path-provisioner
          image: rancher/local-path-provisioner:v0.0.31
          imagePullPolicy: IfNotPresent
          command:
            - local-path-provisioner
            - start
            - --config
            - /etc/config/config.json
            - --provisioner-name
            - rancher.io/local-path-storage-fast
            - --configmap-name
            - local-path-config-storage-fast
            - --service-account-name
            - local-path-provisioner-storage-fast
          volumeMounts:
            - name: config-volume
              mountPath: /etc/config/
          env:
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 128Mi
      volumes:
        - name: config-volume
          configMap:
            name: local-path-config-storage-fast
