githubConfigUrl: "https://github.com/utensils"
githubConfigSecret:
  github_app_id: "REDACTED"
  github_app_installation_id: "REDACTED"
  github_app_private_key: "REDACTED"

runnerGroup: "Default"

# Lint, docs, and bun/web builds. Smaller and more numerous than the XL tier.
minRunners: 0
maxRunners: 4

runnerScaleSetName: "utensils-l"

template:
  spec:
    # hal9000 is the sole Ready node and carries the selfhost-l label.
    nodeSelector:
      gha-tier: selfhost-l

    volumes:
      # Per-pod volume on /storage-fast (ZFS, ~780G free), created when the pod
      # is scheduled and deleted with it. Keeping the work tree off the root
      # filesystem matters: root is 83% used and shared with the mold server,
      # and filling it triggers kubelet eviction of both.
      - name: work
        ephemeral:
          volumeClaimTemplate:
            spec:
              accessModes: ["ReadWriteOnce"]
              storageClassName: storage-fast-path
              resources:
                requests:
                  storage: 30Gi
      # Warm caches shared by every runner on this node. Without them each
      # ephemeral runner starts cold and the Rust workspace rebuilds from
      # scratch every run. All of these are safe under concurrent access:
      # cargo takes file locks, bun's store is content-addressed, and sccache
      # is built for parallel clients.
      - name: runner-cache
        hostPath:
          path: /storage-fast/gha-cache
          type: Directory

    containers:
      - name: runner
        image: ghcr.io/jamesbrink/github-runner-full:latest
        command: ["/home/runner/run.sh"]
        env:
          - name: RUNNER_LABELS
            value: "utensils-l,selfhost-l"
          - name: CARGO_HOME
            value: /cache/cargo
          - name: SCCACHE_DIR
            value: /cache/sccache
          - name: BUN_INSTALL_CACHE_DIR
            value: /cache/bun
          - name: RUNNER_TOOL_CACHE
            value: /cache/tools
        volumeMounts:
          - name: work
            mountPath: /home/runner/_work
          - name: runner-cache
            mountPath: /cache
        resources:
          requests:
            cpu: "2"
            memory: "4Gi"
            # The build tree lives on the PVC now, so this only covers the
            # container's own writable layer.
            ephemeral-storage: "4Gi"
          limits:
            cpu: "8"
            memory: "16Gi"
            ephemeral-storage: "16Gi"

containerMode:
  type: "dind"
